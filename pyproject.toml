[project]
name = "optimus"
version = "0.1.0"
description = "Discord moderation bot for detecting and removing scam/phishing images in near-real-time."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "optimus contributors" }]
dependencies = [
    "hikari>=2.7.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "redis>=8.1.0",
    "nats-py>=2.16.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "numpy>=2.5.4",
    "PyWavelets>=1.10.0",
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pynacl>=1.6.2",
    "aiohttp>=3.14.5",
    "aiosqlite>=0.22.1",
    "opencv-python-headless>=5.0.0.93",
    "pytesseract>=0.3.13",
]

[project.scripts]
optimus = "optimus.__main__:main"

[project.optional-dependencies]
embedding = ["onnxruntime>=1.31.0"]
evidence = ["aioboto3>=15.5.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.170.11",
    "fakeredis>=2.40.0",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "qrcode[pil]>=8.2",
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optimus"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/optimus", "benchmarks"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pywt.*", "onnxruntime.*", "nats", "nats.*", "PIL.*", "aioboto3.*", "botocore.*", "pytesseract"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/optimus"]
branch = true
